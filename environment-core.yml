# environment-core.yml
name: atw-core
channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip

  # Web framework
  - fastapi=0.115
  - uvicorn=0.32
  - jinja2=3.1
  - python-multipart=0.0.12
  - pydantic=2.9

  # Database (PostgreSQL + PostGIS)
  - sqlalchemy=2.0
  - alembic=1.13
  - psycopg2=2.9
  - geoalchemy2=0.15
  # - postgresql  # <-- TIDAK perlu, server sudah ada di sistem

  # Spatial (untuk manipulasi di Python)
  - geopandas=1.0
  - shapely=2.0
  - pyproj=3.6
  - fiona=1.10
  - rtree=1.3

  # Data
  - pandas=2.2
  - numpy=1.26
  - duckdb=1.1
  - openpyxl=3.1
  - pyarrow=17.0

  # Utils
  - python-dotenv=1.0
  - pyyaml=6.0
  - loguru=0.7
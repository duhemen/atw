{% extends "base.html" %}
{% block content %}
<div class="verify-page">
    <h1>🔍 Verifikasi Foto</h1>
    <p class="verify-subtitle">

{% block scripts %}
<script src="{{ url_for('static', path='js/verify.js') }}"></script>
{% endblock %}

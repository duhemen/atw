{% extends "base.html" %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>📝 Daftar ATW</h1>
        <p class="auth-subtitle">Buat akun untuk berkontribusi dokumentasi</p>
        <div id="auth-alert" class="feedback-alert" style="display:none"></div>

        <form id="register-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg-username" required minlength="3" maxlength="50">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" required>
            </div>
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="reg-fullname" required maxlength="100">
            </div>
            <div class="form-group">
                <label>Password (min 6 karakter)</label>
                <input type="password" id="reg-password" required minlength="6">
            </div>
            <button type="submit" class="btn-primary" style="width:100%;margin-top:12px">
                ✅ Daftar & Masuk
            </button>
        </form>

        <p class="auth-switch">
            Sudah punya akun? <a href="/login">Login di sini</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/auth.js') }}"></script>
{% endblock %}
